<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal</title>
<style>
  :root {
    --bg: #0c0f14; --ink: #d7dee8; --dim: #7d8da3; --green: #3fb950;
    --blue: #4f9cf9; --yellow: #d29922; --path: #56d4dd;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 15px; line-height: 1.62; display: flex; flex-direction: column; }
  .bar {
    height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: #151a21; border-bottom: 1px solid #232a34; color: var(--dim); font-size: 12px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .title { flex: 1; text-align: center; }
  .screen { flex: 1; overflow-y: auto; padding: 16px 20px 28px; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--green); }
  .cwd { color: var(--path); }
  .cmd { color: var(--ink); }
  .out { color: var(--dim); }
  .ok { color: var(--green); }
  .warn { color: var(--yellow); }
  .caret { display: inline-block; width: 8px; height: 17px; background: var(--ink); vertical-align: -3px; animation: b 1s steps(2) infinite; }
  @keyframes b { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">bash — enablement-workflow-configs</span></div>
<div class="screen" id="screen"><div id="line"><span class="prompt">sa@legion</span> <span class="cwd">~</span> $ <span class="cmd" id="cmd"></span><span class="caret"></span></div></div>

<script>
(() => {
  'use strict';
  const screen = document.getElementById('screen');
  let line = document.getElementById('line');
  let cmdEl = document.getElementById('cmd');
  let cwd = '~';

  // Canned, deterministic output. A recording must be reproducible, so nothing here
  // depends on the clock or on randomness.
  const RESPONSES = [
    { re: /^git\s+clone/, out: [
      "Cloning into 'enablement-workflow-configs'...",
      'remote: Enumerating objects: 1847, done.',
      'remote: Counting objects: 100% (1847/1847), done.',
      'remote: Compressing objects: 100% (912/912), done.',
      'Receiving objects: 100% (1847/1847), 4.21 MiB | 6.83 MiB/s, done.',
      'Resolving deltas: 100% (734/734), done.',
    ], cls: 'out' },
    { re: /^cd\s+(\S+)/, out: [], cwd: (m) => m[1].replace(/\/$/, '') },
    { re: /^ls\s+\.claude\/skills/, out: ['legion-agent-builder/    socrates-sa-onboarding/'], cls: 'ok' },
    { re: /^ls\b/, out: ['Dev/        Modules/     Prod/        .claude/     README.md'], cls: 'out' },
    { re: /^npm\s+install/, out: ['added 21 packages in 4s'], cls: 'out' },
  ];

  function append(html, cls) {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = html;
    screen.insertBefore(div, line);
    screen.scrollTop = screen.scrollHeight;
  }

  function newPrompt() {
    line.remove();
    const div = document.createElement('div');
    div.innerHTML = '<span class="prompt">sa@legion</span> <span class="cwd">' + cwd +
                    '</span> $ <span class="cmd"></span><span class="caret"></span>';
    screen.appendChild(div);
    line = div;
    cmdEl = div.querySelector('.cmd');
    screen.scrollTop = screen.scrollHeight;
  }

  window.fixture = {
    /** Put text on the current prompt line without running it. */
    setCommand(text) { cmdEl.textContent = String(text || ''); },

    /** Commit the current line: echo it, print canned output, open a fresh prompt. */
    run(text) {
      const cmd = String(text !== undefined ? text : cmdEl.textContent).trim();
      cmdEl.textContent = cmd;
      const rendered = line.cloneNode(true);
      rendered.querySelector('.caret')?.remove();
      screen.insertBefore(rendered, line);
      line.remove();
      const holder = document.createElement('div');
      screen.appendChild(holder);
      line = holder;

      for (const r of RESPONSES) {
        const m = r.re.exec(cmd);
        if (!m) continue;
        if (r.cwd) cwd = r.cwd(m);
        r.out.forEach((o) => append(o, r.cls));
        break;
      }
      newPrompt();
      return true;
    },

    /** Run several lines as one paste, the way a multi-line code block reads. */
    runAll(text) {
      String(text).split('\n').map((s) => s.trim()).filter(Boolean).forEach((l) => this.run(l));
      return true;
    },

    reset() { screen.innerHTML = ''; cwd = '~'; newPrompt(); }
  };

  // Start from a clean prompt so the first frame matches '[SCREEN] Empty terminal'.
  screen.innerHTML = '';
  newPrompt();
})();
</script>
</body>
</html>
