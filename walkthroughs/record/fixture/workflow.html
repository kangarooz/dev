<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>workflow.json — Legion</title>
<style>
  :root {
    --bg: #0f1319; --panel: #161b23; --line: #2a323f;
    --ink: #e6ebf2; --dim: #93a1b5; --faint: #64748b;
    --accent: #4f9cf9; --key: #79c0ff; --str: #a5d6ff; --num: #d2a8ff;
    --bool: #ff7b72; --punc: #7d8590;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  header { height: 46px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 650; } .brand span { color: var(--accent); }
  .path { font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .spacer { flex: 1; }
  .tag { font-size: 12px; color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }

  .code { flex: 1; overflow: auto; padding: 16px 0 40px; }
  table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 14px; line-height: 1.62; }
  td.ln {
    width: 56px; text-align: right; padding: 0 14px 0 0; color: var(--faint);
    user-select: none; vertical-align: top; font-variant-numeric: tabular-nums;
  }
  td.src { padding: 0 20px 0 0; white-space: pre; vertical-align: top; }
  tr.hl { background: rgba(79,156,249,.13); }
  tr.hl td.ln { color: var(--accent); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  .k { color: var(--key); } .s { color: var(--str); } .n { color: var(--num); }
  .b { color: var(--bool); } .p { color: var(--punc); }
</style>
</head>
<body>
<header>
  <div class="brand">Legion <span>·</span> workflow-configs</div>
  <div class="path" id="path">Dev/templated-writing/document-creation/workflow.json</div>
  <div class="spacer"></div>
  <div class="tag">read only</div>
</header>
<div class="code"><table id="tbl"></table></div>

<script>
(() => {
  'use strict';
  // A small, honest-looking Legion workflow: enough real structure (step ids,
  // depends_on, conditions, state keys) that episodes 04, 05, 09 and 11 have
  // something true-shaped to point at on screen.
  const WORKFLOWS = {
    // The compact teaching example episode 05 reads.
    'document-creation': {
      name: 'document-creation',
      description: 'Draft a document from source material using a templated writing pass.',
      initial_state: { template_name: 'mission-brief', tone: 'plain' },
      persist_keys: ['last_document_id'],
      steps: [
        { id: 'intake_sources', type: 'native:input', outputs: ['source_docs'] },
        { id: 'extract_facts', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Extract every factual claim from $state.source_docs as a list.',
          depends_on: ['intake_sources'], outputs: ['extracted_facts'] },
        { id: 'have_facts', type: 'native:condition',
          conditions: [{ key: 'extracted_facts', op: 'not_empty' }] },
        { id: 'outline_subagent', type: 'native:subagent', workflow: 'Dev/shared/outline-builder',
          depends_on: ['extract_facts'], conditions: ['have_facts'],
          inputs: { facts: '$state.extracted_facts', template: '$state.template_name' },
          outputs: ['document_outline'] },
        { id: 'write_document', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Write the document following $state.document_outline in a $state.tone voice.',
          depends_on: ['outline_subagent'], outputs: ['document_draft'] },
        { id: 'attach_sources', type: 'native:attributions',
          depends_on: ['write_document'], inputs: { text: '$state.document_draft' },
          outputs: ['cited_document'] },
        { id: 'deliver', type: 'native:send-message',
          depends_on: ['attach_sources'], inputs: { body: '$state.cited_document' } }
      ]
    },

    // Episode 11 is about learning from complexity without copying it blindly, so the
    // file it points at has to actually BE complex — and the complexity has to look
    // earned by an integration problem rather than decorative.
    'jira-assistant': {
      name: 'on-prem-jira-assistant',
      description: 'Answer questions against an on-prem Jira instance and file issues on request.',
      initial_state: { jira_base: 'https://jira.internal', default_project: 'OPS', max_results: 25 },
      persist_keys: ['jira_session', 'last_issue_key'],
      steps: [
        { id: 'intake', type: 'native:input', outputs: ['user_query'] },
        { id: 'classify_intent', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Classify $state.user_query as one of: search, create, comment, unknown.',
          depends_on: ['intake'], outputs: ['intent'] },
        { id: 'auth_check', type: 'native:http',
          method: 'GET', url: '$state.jira_base/rest/api/2/myself',
          headers: { Authorization: 'Bearer $secret.jira_token' },
          retry: { attempts: 3, backoff_ms: 500, on_status: [502, 503, 504] },
          depends_on: ['intake'], outputs: ['jira_session'] },
        { id: 'auth_ok', type: 'native:condition',
          conditions: [{ key: 'jira_session.accountId', op: 'exists' }] },
        { id: 'build_jql', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Turn $state.user_query into a JQL query scoped to $state.default_project.',
          depends_on: ['classify_intent'], conditions: [{ key: 'intent', op: 'equals', value: 'search' }],
          outputs: ['jql'] },
        { id: 'search_issues', type: 'native:http',
          method: 'POST', url: '$state.jira_base/rest/api/2/search',
          body: { jql: '$state.jql', maxResults: '$state.max_results' },
          retry: { attempts: 2, backoff_ms: 750 },
          depends_on: ['build_jql', 'auth_check'], conditions: ['auth_ok'],
          outputs: ['issue_page'] },
        { id: 'normalise_issues', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Reduce $state.issue_page.issues to key, summary, status, assignee.',
          depends_on: ['search_issues'], outputs: ['issues'] },
        { id: 'found_any', type: 'native:condition',
          conditions: [{ key: 'issues', op: 'not_empty' }] },
        { id: 'summarise', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Answer $state.user_query using $state.issues. Cite issue keys.',
          depends_on: ['normalise_issues'], conditions: ['found_any'], outputs: ['answer_text'] },
        { id: 'no_results_reply', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Explain that nothing matched and suggest a broader query.',
          depends_on: ['normalise_issues'],
          conditions: [{ key: 'issues', op: 'empty' }], outputs: ['answer_text'] },
        { id: 'create_issue', type: 'native:http',
          method: 'POST', url: '$state.jira_base/rest/api/2/issue',
          body: { fields: { project: { key: '$state.default_project' }, summary: '$state.user_query' } },
          depends_on: ['classify_intent', 'auth_check'],
          conditions: [{ key: 'intent', op: 'equals', value: 'create' }, 'auth_ok'],
          outputs: ['last_issue_key'] },
        { id: 'auth_failed_reply', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Tell the user the Jira session could not be established and who to contact.',
          depends_on: ['auth_check'],
          conditions: [{ key: 'jira_session.accountId', op: 'not_exists' }], outputs: ['answer_text'] },
        { id: 'attributions', type: 'native:attributions',
          depends_on: ['summarise'], inputs: { text: '$state.answer_text' }, outputs: ['cited_answer'] },
        { id: 'reply', type: 'native:send-message',
          depends_on: ['attributions'], inputs: { body: '$state.cited_answer' } }
      ]
    }
    // Episode 09's subject is unified_search and attributions. It must be able to see
    // both on screen, or the narration is describing an absent file.
    'it-helpdesk': {
      name: 'it_helpdesk_tier0_agent',
      description: 'Tier-zero IT helpdesk agent answering from internal documentation.',
      initial_state: { knowledge_base: 'it-helpdesk', min_confidence: 0.45 },
      persist_keys: ['last_ticket_id'],
      steps: [
        { id: 'intake', type: 'native:input', outputs: ['user_query'] },
        { id: 'retrieve', type: 'native:unified_search',
          inputs: { query: '$state.user_query', collections: ['$state.knowledge_base'], top_k: 8 },
          depends_on: ['intake'], outputs: ['search_results'] },
        { id: 'have_hits', type: 'native:condition',
          conditions: [{ key: 'search_results', op: 'not_empty' }] },
        { id: 'answer', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Answer $state.user_query using only $state.search_results. Say so if it is not covered.',
          depends_on: ['retrieve'], conditions: ['have_hits'], outputs: ['answer_text'] },
        { id: 'no_hits_reply', type: 'native:chat', model: 'gpt-5.4',
          prompt: 'Explain that the helpdesk documentation does not cover this and offer to raise a ticket.',
          depends_on: ['retrieve'],
          conditions: [{ key: 'search_results', op: 'empty' }], outputs: ['answer_text'] },
        { id: 'cite', type: 'native:attributions',
          depends_on: ['answer'], inputs: { text: '$state.answer_text', sources: '$state.search_results' },
          outputs: ['cited_answer'] },
        { id: 'reply', type: 'native:send-message',
          depends_on: ['cite'], inputs: { body: '$state.cited_answer' } }
      ]
    }
  };

  const params = new URLSearchParams(location.search);
  const WORKFLOW = WORKFLOWS[params.get('w')] || WORKFLOWS['document-creation'];

  // Deliberately hand-rolled: a dependency-free tokeniser keeps the fixture
  // self-contained, which is the whole point of it.
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function highlight(line) {
    let out = '', i = 0;
    while (i < line.length) {
      const rest = line.slice(i);
      let m;
      if ((m = /^"(?:[^"\\]|\\.)*"(\s*:)?/.exec(rest))) {
        const isKey = !!m[1];
        out += '<span class="' + (isKey ? 'k' : 's') + '">' + esc(m[0].replace(/\s*:$/, '')) + '</span>';
        if (isKey) out += '<span class="p">:</span>';
        i += m[0].length; continue;
      }
      if ((m = /^-?\d+(?:\.\d+)?/.exec(rest))) { out += '<span class="n">' + m[0] + '</span>'; i += m[0].length; continue; }
      if ((m = /^(true|false|null)\b/.exec(rest))) { out += '<span class="b">' + m[0] + '</span>'; i += m[0].length; continue; }
      if ((m = /^[{}\[\],]/.exec(rest))) { out += '<span class="p">' + m[0] + '</span>'; i += 1; continue; }
      out += esc(rest[0]); i += 1;
    }
    return out;
  }

  const lines = JSON.stringify(WORKFLOW, null, 2).split('\n');
  const tbl = document.getElementById('tbl');
  const rows = lines.map((line, idx) => {
    const tr = document.createElement('tr');
    tr.id = 'L' + (idx + 1);
    tr.innerHTML = '<td class="ln">' + (idx + 1) + '</td><td class="src">' + highlight(line) + '</td>';
    tbl.appendChild(tr);
    return { tr, line };
  });

  window.fixture = {
    // Point the camera at a step id or state key and hold it there — episodes 05 and
    // 09 both call for naming real step ids on screen.
    highlight(needle) {
      rows.forEach((r) => r.tr.classList.remove('hl'));
      const hits = rows.filter((r) => r.line.includes(needle));
      hits.forEach((r) => r.tr.classList.add('hl'));
      if (hits.length) hits[0].tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return hits.length;
    },
    setPath(p) { document.getElementById('path').textContent = p; },
    lineCount() { return rows.length; },
    clear() { rows.forEach((r) => r.tr.classList.remove('hl')); }
  };
})();
</script>
</body>
</html>
